name: Docker Build and Push

on:
  push:
    branches:
      - master
      - dev
      - classical
  workflow_dispatch:

env:
  REGISTRY_USER: ikun11451
  IMAGE_BASE: mofox-core

jobs:
  build-amd64:
    name: Build AMD64 Image
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 新增：动态计算镜像名称
      - name: Determine Image Name
        id: image_name
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "REPO_NAME=${{ env.REGISTRY_USER }}/${{ env.IMAGE_BASE }}" >> $GITHUB_ENV
          else
            echo "REPO_NAME=${{ env.REGISTRY_USER }}/${{ env.IMAGE_BASE }}-${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --debug

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push AMD64
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          file: ./Dockerfile
          push: true
          # 修改：使用 REPO_NAME 变量
          outputs: type=image,name=${{ env.REPO_NAME }},push-by-digest=true,name-canonical=true
          cache-from: type=registry,ref=${{ env.REPO_NAME }}:amd64-cache
          cache-to: type=registry,ref=${{ env.REPO_NAME }}:amd64-cache,mode=max

  build-arm64:
    name: Build ARM64 Image
    runs-on: ubuntu-24.04-arm
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 新增：同样需要计算名称
      - name: Determine Image Name
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "REPO_NAME=${{ env.REGISTRY_USER }}/${{ env.IMAGE_BASE }}" >> $GITHUB_ENV
          else
            echo "REPO_NAME=${{ env.REGISTRY_USER }}/${{ env.IMAGE_BASE }}-${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          buildkitd-flags: --debug

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push ARM64
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/arm64
          file: ./Dockerfile
          push: true
          # 修改：使用 REPO_NAME 变量
          outputs: type=image,name=${{ env.REPO_NAME }},push-by-digest=true,name-canonical=true
          cache-from: type=registry,ref=${{ env.REPO_NAME }}:arm64-cache
          cache-to: type=registry,ref=${{ env.REPO_NAME }}:arm64-cache,mode=max

  create-manifest:
    name: Create Multi-Arch Manifest
    runs-on: ubuntu-latest
    needs:
      - build-amd64
      - build-arm64
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # 新增：Manifest 步骤也需要计算名称
      - name: Determine Image Name
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "REPO_NAME=${{ env.REGISTRY_USER }}/${{ env.IMAGE_BASE }}" >> $GITHUB_ENV
          else
            echo "REPO_NAME=${{ env.REGISTRY_USER }}/${{ env.IMAGE_BASE }}-${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      - name: Create and Push Manifest
        run: |
          # 修改：使用 REPO_NAME
          FULL_IMAGE_NAME="${{ env.REPO_NAME }}:latest"
          echo "Creating manifest for $FULL_IMAGE_NAME"
          docker buildx imagetools create -t $FULL_IMAGE_NAME \
            ${{ env.REPO_NAME }}@${{ needs.build-amd64.outputs.digest }} \
            ${{ env.REPO_NAME }}@${{ needs.build-arm64.outputs.digest }}
