services:
  core:
    container_name: MoFox-Bot
    #### prod ####
    image: ericterminal/mofox:classical
    #### dev ####
    # image: ericterminal/mofox:dev
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./.env:/app/.env # 持久化env配置文件
      - ./config:/app/config # 持久化bot配置文件
      - ./mofox_bot_statistics.html:/app/mofox_bot_statistics.html #统计数据输出
      - ./data:/app/data # 共享目录
      - ./plugins:/app/plugins # 插件目录
      - ./logs:/app/logs # 日志目录
    restart: always
    networks:
      - mofox
  napcat:
    environment:
      - NAPCAT_UID=1000
      - NAPCAT_GID=1000
      - TZ=Asia/Shanghai
    ports:
      - "6099:6099"
    volumes:
      - ./docker-config/napcat:/app/napcat/config # 持久化napcat配置文件
      - ./data/qq:/app/.config/QQ # 持久化QQ本体
      - ./data/app:/app/data # 共享目录
    container_name: mofox-napcat
    restart: always
    image: mlikiowa/napcat-docker:latest
    networks:
      - mofox

  # chat2db占用相对较高但是功能强大
  # 内存占用约600m，内存充足推荐选此
  # chat2db:
  #   image: chat2db/chat2db:latest
  #   container_name: maim-bot-chat2db
  #   restart: always
  #   ports:
  #     - "10824:10824"
  #   volumes:
  #     - ./data/chat2db:/data/app
  #   networks:
  #     - mofox
volumes:
  site-packages:
networks:
  mofox:
    driver: bridge
